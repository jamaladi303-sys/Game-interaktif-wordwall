<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Game Ceria Anak Hebat</title>
    <!-- FONT DARI GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Bubblegum Sans', cursive;
            background-color: #f0faff; 
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #FF9A8B 0%, #FF6A88 55%, #FF99AC 100%);
            color: white;
            text-align: center;
            padding: 4rem 1rem; 
            margin-bottom: 2rem;
            box-shadow: 0 6px 10px rgba(0,0,0,0.15);
            border-bottom-left-radius: 50px; 
            border-bottom-right-radius: 50px;
            position: relative;
        }
        
        header::before {
            content: "";
            position: absolute;
            bottom: 10px;
            left: 20px;
            width: 80px;
            height: 80px;
            background-image: url('https://cdn-icons-png.flaticon.com/512/1998/1998679.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.9;
        }

        header h1 {
            font-size: 3.5rem; 
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        header p {
            font-size: 1.5rem;
            opacity: 0.95;
            font-weight: bold;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem; 
            padding: 0 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 5px solid transparent; 
        }
        .game-card:hover {
            transform: translateY(-10px) scale(1.03); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .game-title {
            padding: 1.5rem 1rem;
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 75%; 
            height: 0;
            overflow: hidden;
            background-color: #eee; 
        }
        
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Overlay Tombol Raksasa */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.85); 
            z-index: 10; 
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(3px); 
        }
        
        .play-btn {
            background-color: #4ECDC4;
            color: white;
            padding: 15px 30px;
            font-size: 1.8rem;
            border-radius: 50px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .play-overlay:hover .play-btn {
            transform: scale(1.1); 
            background-color: #45b8b0;
        }

        /* Warna Tiap Kartu */
        .card-1 { border-color: #FF6B6B; } /* Merah */
        .card-1 .game-title { background-color: #FF6B6B; }

        .card-2 { border-color: #4ECDC4; } /* Toska */
        .card-2 .game-title { background-color: #4ECDC4; }

        .card-3 { border-color: #FFD93D; } /* Kuning */
        .card-3 .game-title { background-color: #FFD93D; color: #333; } 

        .card-4 { border-color: #FF8C42; } /* Oranye */
        .card-4 .game-title { background-color: #FF8C42; }

        footer {
            text-align: center;
            padding: 3rem;
            margin-top: 4rem;
            background-color: #FF99AC;
            color: white;
            font-size: 1.2rem;
            border-top-left-radius: 50px;
            border-top-right-radius: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Portal Game Ceria</h1>
        <p>Ayo Main dan Belajar, Anak Hebat!</p>
    </header>

    <main class="game-grid">
        
        <!-- GAME 1: Mencocokkan -->
        <div class="game-card card-1">
            <div class="game-title">🧩 Mencocokkan</div>
            <div class="iframe-container">
                <div class="play-overlay" onclick="bukaLayarPenuh(this)">
                    <div class="play-btn">▶️ MAIN FULL SCREEN</div>
                </div>
                <iframe src="https://wordwall.net/id/embed/c520b8dcc5b54039ae3102063e234ff8?themeId=1&templateId=46&fontStackId=0" allowfullscreen></iframe>
            </div>
        </div>

        <!-- GAME 2: Bahan Jamu -->
        <div class="game-card card-2">
            <div class="game-title">🌿 Bahan Jamu</div>
            <div class="iframe-container">
                <div class="play-overlay" onclick="bukaLayarPenuh(this)">
                    <div class="play-btn">▶️ MAIN FULL SCREEN</div>
                </div>
                <iframe src="https://wordwall.net/id/embed/a40a119a368f43299b3bd3692b0ac33e?themeId=2&templateId=5&fontStackId=0" allowfullscreen></iframe>
            </div>
        </div>

        <!-- GAME 3: Pasangkan Bahan Jamu -->
        <div class="game-card card-3">
            <div class="game-title">🔗 Pasangkan Jamu</div>
            <div class="iframe-container">
                <div class="play-overlay" onclick="bukaLayarPenuh(this)">
                    <div class="play-btn">▶️ MAIN FULL SCREEN</div>
                </div>
                <iframe src="https://wordwall.net/id/embed/0c362e2339a740c5a762703919e301e6?themeId=65&templateId=25&fontStackId=0" allowfullscreen></iframe>
            </div>
        </div>

        <!-- GAME 4: Kelompokkan Bahan Jamu -->
        <div class="game-card card-4">
            <div class="game-title">🧺 Kelompokkan Jamu</div>
            <div class="iframe-container">
                <div class="play-overlay" onclick="bukaLayarPenuh(this)">
                    <div class="play-btn">▶️ MAIN FULL SCREEN</div>
                </div>
                <iframe src="https://wordwall.net/id/embed/838c49c2528e43f790a3cf114d97549a?themeId=2&templateId=2&fontStackId=0" allowfullscreen></iframe>
            </div>
        </div>

    </main>

    <footer>
        <p>Dibuat dengan ❤️ untuk Anak Indonesia</p>
        <p>&copy; 2026 Portal Game Saya.</p>
    </footer>

    <!-- JAVASCRIPT UNTUK LAYAR PENUH & BERHENTI OTOMATIS -->
    <script>
        // Fungsi untuk memaksa iframe masuk ke Layar Penuh
        function bukaLayarPenuh(elemenOverlay) {
            const wadah = elemenOverlay.parentElement;
            const iframe = wadah.querySelector('iframe');

            // 1. Minta browser masuk ke Layar Penuh
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) { /* Untuk Safari */
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) { /* Untuk Internet Explorer */
                iframe.msRequestFullscreen();
            }

            // 2. Sembunyikan tombol raksasa
            elemenOverlay.style.display = "none";
        }

        // Event pendeteksi ketika pengguna KELUAR dari Layar Penuh
        document.addEventListener('fullscreenchange', deteksiKeluarLayar);
        document.addEventListener('webkitfullscreenchange', deteksiKeluarLayar);

        function deteksiKeluarLayar() {
            // Jika sudah tidak di layar penuh...
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                
                // 1. Munculkan kembali semua tombol raksasa
                const semuaOverlay = document.querySelectorAll('.play-overlay');
                semuaOverlay.forEach(overlay => {
                    overlay.style.display = "flex";
                });

                // 2. Matikan paksa (reset) semua game agar suara tidak bocor
                const semuaIframe = document.querySelectorAll('.iframe-container iframe');
                semuaIframe.forEach(iframe => {
                    let sumberSaatIni = iframe.src;
                    iframe.src = ''; 
                    iframe.src = sumberSaatIni; 
                });
            }
        }
    </script>

</body>
</html>
