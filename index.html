<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Game Ceria Anak Hebat</title>
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Bubblegum Sans', cursive;
            background: #eef9ff;
            overflow-x: hidden;
        }

        /*==========================
        HEADER
        ===========================*/
        header {
            background: linear-gradient(135deg, #ff8a8a, #ff6aa2);
            color: white;
            padding: 35px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,.15);
            border-radius: 0 0 35px 35px;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.3rem;
        }

        /*==========================
        GRID MENU
        ===========================*/
        .game-grid {
            width: min(900px, 95%);
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            padding: 20px;
        }

        .game-card {
            background: white;
            border-radius: 30px;
            padding: 30px;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
            border: 6px solid transparent;
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.03);
        }

        .game-card:active {
            transform: scale(0.97);
        }

        .game-icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .game-title {
            font-size: 32px;
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .play-btn {
            padding: 14px 34px;
            border-radius: 100px;
            color: white;
            font-size: 24px;
            font-family: inherit;
            border: none;
            cursor: pointer;
        }

        /*====================
        WARNA CARD
        ====================*/
        .card1 { border-color: #ff6b6b; }
        .card1 .play-btn { background: #ff6b6b; }
        
        .card2 { border-color: #4ecdc4; }
        .card2 .play-btn { background: #4ecdc4; }
        
        .card3 { border-color: #f5c242; }
        .card3 .play-btn { background: #f5c242; }
        
        .card4 { border-color: #ff9248; }
        .card4 .play-btn { background: #ff9248; }

        /*======================
        FOOTER
        =======================*/
        footer {
            text-align: center;
            padding: 35px;
            color: white;
            background: #ff8ba0;
            margin-top: 50px;
            border-radius: 35px 35px 0 0;
            font-size: 1.2rem;
        }

        /*======================
        GAME VIEW
        =======================*/
        #gameView {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            flex-direction: column;
            z-index: 99999;
        }

        /*========================
        TOOLBAR
        =========================*/
        .toolbar {
            height: 65px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            color: white;
        }

        .left-tools, .right-tools {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .toolbar button {
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-family: inherit;
            transition: 0.2s;
        }

        .toolbar button:hover {
            background: #2fb6ad;
        }

        /*======================
        FRAME
        =======================*/
        #iframeContainer {
            flex: 1;
            background: #111;
            position: relative;
        }

        #iframeGame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /*======================
        LOADING
        =======================*/
        #loading {
            position: absolute;
            top: 65px; /* Sesuaikan dengan tinggi toolbar */
            left: 0;
            width: 100%;
            height: calc(100% - 65px);
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            z-index: 5;
            color: #333;
        }

        .spinner {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 8px solid #ddd;
            border-top: 8px solid #4ecdc4;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /*======================
        RESPONSIVE (MOBILE)
        =======================*/
        @media (max-width: 768px) {
            header h1 {
                font-size: 2.2rem;
            }
            header p {
                font-size: 1.1rem;
            }
            .game-grid {
                grid-template-columns: 1fr;
                width: 95%;
                gap: 20px;
                padding: 15px;
            }
            .game-title {
                font-size: 26px;
            }
            .play-btn {
                font-size: 20px;
            }
            .toolbar {
                height: auto;
                padding: 10px;
                flex-wrap: wrap;
                gap: 10px;
                justify-content: center;
            }
            #loading {
                top: 0;
                height: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 Portal Game Ceria</h1>
        <p>Silakan pilih permainan favoritmu</p>
    </header>

    <main class="game-grid">
        <div class="game-card card1" onclick="openGame('https://wordwall.net/embed/play/117048/978/937')">
            <div class="game-icon">🧩</div>
            <div class="game-title">Mencocokkan</div>
            <button class="play-btn">▶ MAIN</button>
        </div>

        <div class="game-card card2" onclick="openGame('https://wordwall.net/embed/play/117049/919/460')">
            <div class="game-icon">🌿</div>
            <div class="game-title">Bahan Jamu</div>
            <button class="play-btn">▶ MAIN</button>
        </div>

        <div class="game-card card3" onclick="openGame('https://wordwall.net/embed/play/117057/994/875')">
            <div class="game-icon">🔗</div>
            <div class="game-title">Pasangkan Jamu</div>
            <button class="play-btn">▶ MAIN</button>
        </div>

        <div class="game-card card4" onclick="openGame('https://wordwall.net/embed/play/117058/214/896')">
            <div class="game-icon">🧺</div>
            <div class="game-title">Kelompokkan Jamu</div>
            <button class="play-btn">▶ MAIN</button>
        </div>
    </main>

    <footer>
        Dibuat dengan ❤️ untuk Anak Indonesia
    </footer>

    <!-- Tampilan saat game dimainkan -->
    <div id="gameView">
        <div class="toolbar">
            <div class="left-tools">
                <button onclick="goHome()">🏠 Home</button>
                <button onclick="reloadGame()">🔄 Muat Ulang</button>
            </div>
            <div class="right-tools">
                <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
                <button onclick="closeGame()">❌ Tutup</button>
            </div>
        </div>

        <div id="iframeContainer">
            <div id="loading">
                <div class="spinner"></div>
                Sedang membuka permainan...
            </div>
            <iframe id="iframeGame" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Script JavaScript untuk menjalankan fungsi interaktif -->
    <script>
        const gameView = document.getElementById('gameView');
        const iframeGame = document.getElementById('iframeGame');
        const loading = document.getElementById('loading');

        // Fungsi membuka game
        function openGame(url) {
            gameView.style.display = 'flex';
            loading.style.display = 'flex'; // Tampilkan loading
            iframeGame.src = url;
            
            // Sembunyikan loading setelah iframe selesai memuat data
            iframeGame.onload = function() {
                loading.style.display = 'none';
            };
        }

        // Fungsi menutup game
        function closeGame() {
            gameView.style.display = 'none';
            iframeGame.src = ''; // Menghentikan game yang sedang berjalan di background
            
            // Keluar dari fullscreen jika sedang aktif
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
        }

        // Fungsi tombol home (sama dengan tutup game)
        function goHome() {
            closeGame();
        }

        // Fungsi muat ulang (refresh game)
        function reloadGame() {
            loading.style.display = 'flex';
            // Menyegarkan URL iframe agar memuat dari awal
            iframeGame.src = iframeGame.src;
        }

        // Fungsi layar penuh (fullscreen)
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                // Meminta fullscreen pada kontainer gameView
                gameView.requestFullscreen().catch(err => {
                    alert(`Gagal membuka mode fullscreen: ${err.message}`);
                });
            } else {
                // Keluar dari fullscreen
                document.exitFullscreen();
            }
        }
    </script>

</body>
</html>
