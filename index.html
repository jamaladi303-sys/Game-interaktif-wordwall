<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Game Ceria Anak Hebat</title>
    <!-- FONT DARI GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Bubblegum Sans', cursive;
            background-color: #f0faff; 
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #FF9A8B 0%, #FF6A88 55%, #FF99AC 100%);
            color: white;
            text-align: center;
            padding: 3rem 1rem; 
            margin-bottom: 2rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-bottom-left-radius: 40px; 
            border-bottom-right-radius: 40px;
        }

        header h1 {
            font-size: 3rem; 
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        header p {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .game-grid {
            display: grid;
            /* Ukuran disesuaikan dengan standar Wordwall */
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem; 
            padding: 0 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border: 5px solid; 
        }

        .game-title {
            padding: 1rem;
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* WADAH IFRAME SUPER STABIL */
        .iframe-container {
            width: 100%;
            height: 380px; /* Menggunakan tinggi pasti bawaan Wordwall */
            background-color: #fff; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Warna Tiap Kartu */
        .card-1 { border-color: #FF6B6B; } 
        .card-1 .game-title { background-color: #FF6B6B; }

        .card-2 { border-color: #4ECDC4; } 
        .card-2 .game-title { background-color: #4ECDC4; }

        .card-3 { border-color: #FFD93D; } 
        .card-3 .game-title { background-color: #FFD93D; color: #333; } 

        .card-4 { border-color: #FF8C42; } 
        .card-4 .game-title { background-color: #FF8C42; }

        footer {
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
            background-color: #FF99AC;
            color: white;
            font-size: 1.2rem;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Portal Game Ceria</h1>
        <p>Ayo Main dan Belajar, Anak Hebat!</p>
    </header>

    <main class="game-grid">
        
        <!-- GAME 1: Mencocokkan -->
        <div class="game-card card-1">
            <div class="game-title">🧩 Mencocokkan</div>
            <div class="iframe-container">
                <iframe src="https://wordwall.net/id/embed/c520b8dcc5b54039ae3102063e234ff8?themeId=1&templateId=46&fontStackId=0" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
        </div>

        <!-- GAME 2: Bahan Jamu -->
        <div class="game-card card-2">
            <div class="game-title">🌿 Bahan Jamu</div>
            <div class="iframe-container">
                <iframe src="https://wordwall.net/id/embed/a40a119a368f43299b3bd3692b0ac33e?themeId=2&templateId=5&fontStackId=0" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
        </div>

        <!-- GAME 3: Pasangkan Bahan Jamu -->
        <div class="game-card card-3">
            <div class="game-title">🔗 Pasangkan Jamu</div>
            <div class="iframe-container">
                <iframe src="https://wordwall.net/id/embed/0c362e2339a740c5a762703919e301e6?themeId=65&templateId=25&fontStackId=0" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
        </div>

        <!-- GAME 4: Kelompokkan Bahan Jamu -->
        <div class="game-card card-4">
            <div class="game-title">🧺 Kelompokkan Jamu</div>
            <div class="iframe-container">
                <iframe src="https://wordwall.net/id/embed/838c49c2528e43f790a3cf114d97549a?themeId=2&templateId=2&fontStackId=0" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
        </div>

    </main>

    <footer>
        <p>Dibuat dengan ❤️ untuk Anak Indonesia</p>
        <p>&copy; 2026 Portal Game Saya.</p>
    </footer>

</body>
</html>
