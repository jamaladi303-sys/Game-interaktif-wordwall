<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Game Ceria Anak Hebat</title>
    <!-- FONT RAMAH ANAK DARI GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Bubblegum Sans', cursive;
            background-color: #f0faff; 
            color: #333;
            padding-bottom: 3rem;
        }

        header {
            background: linear-gradient(135deg, #FF9A8B 0%, #FF6A88 55%, #FF99AC 100%);
            color: white;
            text-align: center;
            padding: 3.5rem 1rem; 
            margin-bottom: 2.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border-bottom-left-radius: 40px; 
            border-bottom-right-radius: 40px;
        }

        header h1 {
            font-size: 3.2rem; 
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        header p {
            font-size: 1.4rem;
            font-weight: bold;
        }

        /* GRID TOMBOL MENU UTAMA */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem; 
            padding: 0 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* KARTU MENU YANG BISA DIKLIK */
        .game-card {
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 6px solid; 
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.5rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 15px 25px rgba(0,0,0,0.2);
        }

        /* IKON BESAR UNTUK ANAK TK */
        .game-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            background: #f9f9f9;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.05);
        }

        .game-title {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 1rem;
        }

        /* TOMBOL MAIN DI DALAM KARTU */
        .play-btn {
            background-color: #4ECDC4;
            color: white;
            padding: 12px 30px;
            font-size: 1.5rem;
            border-radius: 50px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.15);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .game-card:hover .play-btn {
            background-color: #3dbdb5;
        }

        /* WARNA-WARNI KARTU BERBEDA */
        .card-1 { border-color: #FF6B6B; } 
        .card-1 .play-btn { background-color: #FF6B6B; }
        .card-1:hover .play-btn { background-color: #ff5252; }

        .card-2 { border-color: #4ECDC4; } 
        .card-2 .play-btn { background-color: #4ECDC4; }

        .card-3 { border-color: #FFD93D; } 
        .card-3 .play-btn { background-color: #f6c23e; color: #fff; } 

        .card-4 { border-color: #FF8C42; } 
        .card-4 .play-btn { background-color: #FF8C42; }
        .card-4:hover .play-btn { background-color: #fa7b2a; }

        footer {
            text-align: center;
            padding: 2.5rem;
            margin-top: 4rem;
            background-color: #FF99AC;
            color: white;
            font-size: 1.2rem;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Portal Game Ceria</h1>
        <p>Silakan Pilih Game Favoritmu, Anak Hebat! ✨</p>
    </header>

    <main class="game-grid">
        
        <!-- GAME 1: Mencocokkan -->
        <a href="https://wordwall.net/id/resource/c520b8dcc5b54039ae3102063e234ff8" target="_blank" class="game-card card-1">
            <div class="game-icon">🧩</div>
            <div class="game-title">Mencocokkan</div>
            <div class="play-btn">▶️ MAIN</div>
        </a>

        <!-- GAME 2: Bahan Jamu -->
        <a href="https://wordwall.net/id/resource/a40a119a368f43299b3bd3692b0ac33e" target="_blank" class="game-card card-2">
            <div class="game-icon">🌿</div>
            <div class="game-title">Bahan Jamu</div>
            <div class="play-btn">▶️ MAIN</div>
        </a>

        <!-- GAME 3: Pasangkan Bahan Jamu -->
        <a href="https://wordwall.net/id/resource/0c362e2339a740c5a762703919e301e6" target="_blank" class="game-card card-3">
            <div class="game-icon">🔗</div>
            <div class="game-title">Pasangkan Jamu</div>
            <div class="play-btn">▶️ MAIN</div>
        </a>

        <!-- GAME 4: Kelompokkan Bahan Jamu -->
        <a href="https://wordwall.net/id/resource/838c49c2528e43f790a3cf114d97549a" target="_blank" class="game-card card-4">
            <div class="game-icon">🧺</div>
            <div class="game-title">Kelompokkan Jamu</div>
            <div class="play-btn">▶️ MAIN</div>
        </a>

    </main>

    <footer>
        <p>Dibuat dengan ❤️ untuk Anak Indonesia</p>
        <p>&copy; 2026 Portal Game Saya.</p>
    </footer>

</body>
</html>
