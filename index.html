<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Game Ceria Anak Hebat</title>
    <!-- MENGGUNAKAN FONT RAMAH ANAK DARI GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <style>
        /* Pengaturan Dasar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /* FONT UTUAMA JADI BULAT & LUCU */
            font-family: 'Bubblegum Sans', cursive;
            background-color: #f0faff; /* Biru langit sangat muda */
            color: #333;
        }

        /* Bagian Header / Judul Ceria */
        header {
            /* GRADASI WARNA-WARNI CERIA */
            background: linear-gradient(135deg, #FF9A8B 0%, #FF6A88 55%, #FF99AC 100%);
            color: white;
            text-align: center;
            padding: 4rem 1rem; /* Lebih tinggi agar lebih lega */
            margin-bottom: 2rem;
            box-shadow: 0 6px 10px rgba(0,0,0,0.15);
            border-bottom-left-radius: 50px; /* Lengkungan besar di bawah */
            border-bottom-right-radius: 50px;
            position: relative;
        }
        
        /* Menambahkan Karakter Kartun di Header (Opsional, gunakan link gambar Anda sendiri) */
        header::before {
            content: "";
            position: absolute;
            bottom: 10px;
            left: 20px;
            width: 80px;
            height: 80px;
            /* Ganti URL di bawah dengan gambar hewan lucu Anda */
            background-image: url('https://cdn-icons-png.flaticon.com/512/1998/1998679.png'); /* Contoh ikon singa */
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.9;
        }

        header h1 {
            font-size: 3.5rem; /* Lebih Besar */
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        header p {
            font-size: 1.5rem;
            opacity: 0.95;
            font-weight: bold;
        }

        /* Wadah Utama Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem; /* Jarak antar game lebih lebar */
            padding: 0 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Desain Kartu Game */
        .game-card {
            background: white;
            /* BORDER LEBIH BULAT */
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 5px solid transparent; /* Border warna-warni (nanti diatur di tiap kartu) */
        }
        .game-card:hover {
            transform: translateY(-10px) scale(1.03); /* Melayang lebih tinggi & membesar sedikit */
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        /* Judul Game Besar & Solid */
        .game-title {
            padding: 1.5rem 1rem;
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* Wadah Responsif untuk Iframe Wordwall */
        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 75%; /* Rasio aspek 4:3 */
            height: 0;
            overflow: hidden;
            background-color: #eee; /* Warna loading */
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Gaya Khusus untuk Setiap Kartu (Warna Berbeda) */
        .card-1 { border-color: #FF6B6B; } /* Merah */
        .card-1 .game-title { background-color: #FF6B6B; }

        .card-2 { border-color: #4ECDC4; } /* Toska */
        .card-2 .game-title { background-color: #4ECDC4; }

        .card-3 { border-color: #FFD93D; } /* Kuning */
        .card-3 .game-title { background-color: #FFD93D; color: #333; } /* Teks gelap di kuning */

        /* Bagian Footer */
        footer {
            text-align: center;
            padding: 3rem;
            margin-top: 4rem;
            background-color: #FF99AC;
            color: white;
            font-size: 1.2rem;
            border-top-left-radius: 50px;
            border-top-right-radius: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Portal Game Ceria</h1>
        <p>Ayo Main dan Belajar, Anak Hebat!</p>
    </header>

    <main class="game-grid">
        
        <!-- KARTU GAME 1 (MERAH) -->
        <div class="game-card card-1">
            <div class="game-title">🧩 Mencocokkan</div>
            <div class="iframe-container">
                <!-- GANTI LINK EMBED DI BAWAH INI -->
                <iframe src="https://wordwall.net/embed/5eb9cc50fc204532af6d49f357bea426?themeId=1&templateId=8&fontStackId=0" allowfullscreen></iframe>
            </div>
        </div>

        <!-- KARTU GAME 2 (TOSKA) -->
        <div class="game-card card-2">
            <div class="game-title">🔢 Belajar Angka</div>
            <div class="iframe-container">
                <!-- GANTI LINK EMBED DI BAWAH INI -->
                <iframe src="https://wordwall.net/embed/5eb9cc50fc204532af6d49f357bea426?themeId=1&templateId=8&fontStackId=0" allowfullscreen></iframe>
            </div>
        </div>

        <!-- KARTU GAME 3 (KUNING) -->
        <div class="game-card card-3">
            <div class="game-title">🎨 Mengenal Warna</div>
            <div class="iframe-container">
                <!-- GANTI LINK EMBED DI BAWAH INI -->
                <iframe src="https://wordwall.net/embed/5eb9cc50fc204532af6d49f357bea426?themeId=1&templateId=8&fontStackId=0" allowfullscreen></iframe>
            </div>
        </div>

    </main>

    <footer>
        <p>Dibuat dengan ❤️ untuk Anak Indonesia</p>
        <p>&copy; 2026 Portal Game Saya.</p>
    </footer>

</body>
</html>
